plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    // EclipseLink JPA (включает jakarta.persistence API)
    implementation 'org.eclipse.persistence:eclipselink:3.0.2'
    
    // Apache Derby Database
    implementation 'org.apache.derby:derby:10.16.1.1'
    
    // BCrypt for password hashing
    implementation 'org.mindrot:jbcrypt:0.4'
    
    // JAX-RS API (provided by WildFly)
    compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    
    // EJB API (provided by WildFly)
    compileOnly 'jakarta.ejb:jakarta.ejb-api:4.0.1'
    
    // CDI для управляемых бинов (provided by WildFly)
    compileOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
    
    // JPA API для компиляции (provided by WildFly в runtime)
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    
    // Transaction API для компиляции (provided by WildFly в runtime)
    compileOnly 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

war {
    archiveFileName = 'web4.war'
}